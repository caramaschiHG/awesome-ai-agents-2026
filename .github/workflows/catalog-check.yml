name: Catalog integrity

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Test catalog checker
        run: python3 -m unittest discover -s tests -v
      - name: Validate README catalog
        run: python3 scripts/check_catalog.py
